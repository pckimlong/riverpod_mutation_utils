name: Riverpod maintenance

on:
  schedule:
    - cron: "0 3 1 */2 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    name: Upgrade and review Riverpod compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Run Riverpod maintenance
        run: bash .github/scripts/riverpod_maintenance.sh

      - name: Create maintenance pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: maintenance/riverpod-bimonthly
          delete-branch: true
          title: "Review Riverpod dependency and mutation compatibility"
          commit-message: "Review Riverpod dependency compatibility"
          draft: true
          body: |
            ## Summary

            This scheduled PR refreshes Riverpod-related dependencies, captures
            dependency/changelog review evidence, and runs the package
            verification suite.

            Review `.github/maintenance/riverpod-maintenance-report.md` before
            publishing. If Riverpod's mutation API, notifier lifecycle,
            generator output, or analyzer APIs changed, update package code and
            tests in this PR before merging.

            ## Required review

            - Check the Riverpod mutation docs and API reference linked in the
              generated report.
            - Check `riverpod`, `riverpod_annotation`, and
              `riverpod_generator` changelogs for relevant changes.
            - Confirm whether package constraints, changelogs, and versions need
              a publish-ready update.
            - Keep this as a draft until the generated report shows passing
              verification or the failures are intentionally fixed.
